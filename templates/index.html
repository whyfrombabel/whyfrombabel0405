<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeloMind - 音乐发现</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav>
        <span class="logo">🎵 MeloMind</span>
        <div class="nav-actions">
            <button id="themeToggle">🌓 切换主题</button>
            <span id="userArea">
                <a href="#" id="loginLink">登录</a> | <a href="#" id="registerLink">注册</a>
            </span>
        </div>
    </nav>

    <div class="tabs">
        <button class="tab active" data-tab="melody">🎼 旋律追踪</button>
        <button class="tab" data-tab="style">🎧 风格共鸣</button>
    </div>

    <!-- 旋律追踪面板 -->
    <div id="melodyPanel" class="panel active">
        <div class="upload-area" id="melodyDrop">
            <input type="file" id="melodyFile" accept="audio/*" hidden>
            <p>拖拽或点击上传旋律片段</p>
            <small>支持哼唱或器乐，时长10-30秒</small>
        </div>
        <select id="melodyGenre">
            <option value="">不限流派</option>
            <option value="流行">流行</option>
            <option value="摇滚">摇滚</option>
            <option value="电子">电子</option>
            <option value="古典">古典</option>
            <option value="爵士">爵士</option>
        </select>
        <button class="search-btn" onclick="search('melody')">搜索相似旋律</button>
        <div class="results" id="melodyResults"></div>
    </div>

    <!-- 风格共鸣面板 -->
    <div id="stylePanel" class="panel">
        <div class="upload-area" id="styleDrop">
            <input type="file" id="styleFile" accept="audio/*" hidden>
            <p>上传一段音乐（任意长度）</p>
            <small>我们将分析其风格并推荐相似歌曲</small>
        </div>
        <select id="styleGenre">
            <option value="">不限流派</option>
            <option value="流行">流行</option>
            <option value="摇滚">摇滚</option>
            <option value="电子">电子</option>
            <option value="古典">古典</option>
            <option value="爵士">爵士</option>
        </select>
        <button class="search-btn" onclick="search('style')">推荐相似风格</button>
        <div class="results" id="styleResults"></div>
    </div>

    <!-- 登录/注册模态框 -->
    <div id="authModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="authTitle">登录</h2>
            <input type="text" id="authUsername" placeholder="用户名">
            <input type="password" id="authPassword" placeholder="密码">
            <button id="authSubmit">登录</button>
            <p id="authSwitch">没有账号？<a href="#">注册</a></p>
        </div>
    </div>

    <script>
        // 主题切换
        const themeBtn = document.getElementById('themeToggle');
        themeBtn.addEventListener('click', () => {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme');
            html.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
        });

        // 标签切换
        document.querySelectorAll('.tab').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                const tab = this.dataset.tab;
                document.getElementById('melodyPanel').classList.toggle('active', tab==='melody');
                document.getElementById('stylePanel').classList.toggle('active', tab==='style');
            });
        });

        // 上传区域
        function setupUpload(dropId, fileInputId) {
            const drop = document.getElementById(dropId);
            const input = document.getElementById(fileInputId);
            drop.addEventListener('click', () => input.click());
            drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('hover'); });
            drop.addEventListener('dragleave', () => drop.classList.remove('hover'));
            drop.addEventListener('drop', e => {
                e.preventDefault();
                drop.classList.remove('hover');
                if (e.dataTransfer.files.length) {
                    input.files = e.dataTransfer.files;
                }
            });
            input.addEventListener('change', () => {
                if (input.files.length) drop.querySelector('p').textContent = input.files[0].name;
            });
        }
        setupUpload('melodyDrop', 'melodyFile');
        setupUpload('styleDrop', 'styleFile');

        // 搜索请求
        async function search(type) {
            const fileInput = document.getElementById(type === 'melody' ? 'melodyFile' : 'styleFile');
            const genreSelect = document.getElementById(type === 'melody' ? 'melodyGenre' : 'styleGenre');
            const resultsDiv = document.getElementById(type === 'melody' ? 'melodyResults' : 'styleResults');
            if (!fileInput.files.length) {
                alert('请先选择音频文件');
                return;
            }
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            formData.append('genre', genreSelect.value);
            resultsDiv.innerHTML = '搜索中...';
            const res = await fetch(`/api/search/${type}`, { method: 'POST', body: formData });
            const data = await res.json();
            if (data.error) {
                resultsDiv.innerHTML = `<p class="error">${data.error}</p>`;
                return;
            }
            let html = '';
            data.results.forEach(r => {
                html += `
                <div class="song-card">
                    <img src="${r.cover}?param=60y60" onerror="this.src='/static/default.png'">
                    <div class="song-info">
                        <strong>${r.name}</strong>
                        <span>${r.artist}</span>
                    </div>
                    <span class="score">${type==='melody' ? 'DTW '+r.distance.toFixed(0) : r.similarity.toFixed(2)}</span>
                    <audio controls src="${r.play_url}"></audio>
                </div>`;
            });
            resultsDiv.innerHTML = html || '<p>无结果</p>';
        }

        // 登录/注册模态框
        const modal = document.getElementById('authModal');
        const closeBtn = modal.querySelector('.close');
        const loginLink = document.getElementById('loginLink');
        const registerLink = document.getElementById('registerLink');
        const authSwitch = document.getElementById('authSwitch');
        const authTitle = document.getElementById('authTitle');
        const authSubmit = document.getElementById('authSubmit');
        let authMode = 'login';

        function showAuth(mode) {
            authMode = mode;
            authTitle.textContent = mode === 'login' ? '登录' : '注册';
            authSubmit.textContent = mode === 'login' ? '登录' : '注册';
            authSwitch.innerHTML = mode === 'login' ? `没有账号？<a href="#">注册</a>` : `已有账号？<a href="#">登录</a>`;
            modal.style.display = 'block';
        }

        loginLink.addEventListener('click', e => { e.preventDefault(); showAuth('login'); });
        registerLink.addEventListener('click', e => { e.preventDefault(); showAuth('register'); });
        closeBtn.addEventListener('click', () => modal.style.display = 'none');
        window.addEventListener('click', e => { if (e.target === modal) modal.style.display = 'none'; });
        authSwitch.addEventListener('click', (e) => {
            if (e.target.tagName === 'A') {
                e.preventDefault();
                showAuth(authMode === 'login' ? 'register' : 'login');
            }
        });

        authSubmit.addEventListener('click', async () => {
            const username = document.getElementById('authUsername').value;
            const password = document.getElementById('authPassword').value;
            const endpoint = authMode === 'login' ? '/api/login' : '/api/register';
            const res = await fetch(endpoint, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username, password})
            });
            const data = await res.json();
            if (data.error) {
                alert(data.error);
            } else {
                modal.style.display = 'none';
                location.reload();
            }
        });

        // 检查登录状态
        fetch('/api/me').then(r => r.json()).then(data => {
            if (data.logged_in) {
                document.getElementById('userArea').innerHTML = `<span>${data.username}</span> | <a href="#" onclick="logout()">退出</a>`;
            }
        });

        async function logout() {
            await fetch('/api/logout', { method: 'POST' });
            location.reload();
        }
    </script>
</body>
</html>
