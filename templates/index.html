    <button onclick="searchByKeywords()" class="btn">搜索</button>
</div>

    formData.append('keywords', keyword);

// 结果渲染时，使用封面和歌手信息
function renderResults(data) {
    let html = '';
    if (data.mode === 'style') {
        html += `<h3>查询歌曲：${data.query.name} - ${data.query.artists}</h3>`;
        html += `<h3>相似推荐：</h3>`;
        data.results.forEach(r => {
            html += `
            <div class="result-item">
                <img src="${r.cover}?param=50y50" style="width:50px; height:50px; margin-right:15px;">
                <div>
                    <strong>${r.name}</strong><br>${r.artists}
                </div>
                <audio controls src="${r.audio_url}"></audio>
            </div>`;
        });
    } else {
        html += `<h3>旋律匹配结果：</h3>`;
        data.results.forEach(r => {
            html += `
            <div class="result-item">
                <img src="${r.cover}?param=50y50" style="width:50px; height:50px; margin-right:15px;">
                <div>
                    <strong>${r.name}</strong><br>${r.artists}
                </div>
                <span>DTW距离: ${r.score.toFixed(1)}</span>
                <audio controls src="${r.audio_url}"></audio>
            </div>`;
        });
    }
    document.getElementById('results').innerHTML = html;
}
</script>
