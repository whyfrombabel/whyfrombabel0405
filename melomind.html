<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeloMind - 双核音乐发现引擎</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; background: #0f0f0f; color: #e0e0e0; }
        h1 { color: #a855f7; text-align: center; }
        .container { background: #1a1a1a; border-radius: 16px; padding: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .mode-select { display: flex; gap: 20px; margin: 20px 0; justify-content: center; }
        .mode-select label { cursor: pointer; padding: 12px 24px; border-radius: 30px; background: #2a2a2a; transition: 0.2s; }
        .mode-select input[type="radio"] { display: none; }
        .mode-select input:checked + label { background: #a855f7; color: white; }
        .upload-area { border: 2px dashed #555; border-radius: 12px; padding: 30px; text-align: center; margin: 20px 0; }
        .upload-area:hover { border-color: #a855f7; }
        #fileInput { display: none; }
        .btn { display: inline-block; padding: 12px 30px; background: #a855f7; color: white; border: none; border-radius: 30px; cursor: pointer; font-size: 16px; }
        .btn:hover { background: #9333ea; }
        .loading { display: none; text-align: center; margin: 20px; }
        .results { margin-top: 30px; }
        .result-item { display: flex; align-items: center; background: #2a2a2a; padding: 12px; border-radius: 8px; margin-bottom: 10px; }
        .result-item .name { flex: 1; }
        .result-item .score { margin: 0 20px; color: #a855f7; }
        audio { height: 36px; }
    </style>
</head>
<body>
    <h1>🎵 MeloMind</h1>
    <div class="container">
        <p style="text-align:center">选择模式，上传一段音频，发现相似的音乐</p>
        <div class="mode-select">
            <input type="radio" id="mode_style" name="mode" value="style" checked>
            <label for="mode_style">🎧 风格共鸣</label>
            <input type="radio" id="mode_melody" name="mode" value="melody">
            <label for="mode_melody">🎼 旋律追踪</label>
        </div>

        <div class="upload-area" id="dropArea">
            <p>拖拽音频文件到这里，或点击选择</p>
            <input type="file" id="fileInput" accept="audio/*">
            <button class="btn" onclick="document.getElementById('fileInput').click()">选择文件</button>
            <span id="fileName" style="display:block; margin-top:10px; color:#aaa;"></span>
        </div>

        <button class="btn" onclick="search()" style="width:100%;" id="searchBtn">🔍 开始搜索</button>
        <div class="loading" id="loading">分析中，请稍候...</div>
        <div class="results" id="results"></div>
    </div>

    <script>
        const dropArea = document.getElementById('dropArea');
        const fileInput = document.getElementById('fileInput');
        const fileNameSpan = document.getElementById('fileName');

        dropArea.addEventListener('dragover', (e) => { e.preventDefault(); dropArea.style.borderColor = '#a855f7'; });
        dropArea.addEventListener('dragleave', () => { dropArea.style.borderColor = '#555'; });
        dropArea.addEventListener('drop', (e) => {
            e.preventDefault();
            dropArea.style.borderColor = '#555';
            if (e.dataTransfer.files.length) {
                fileInput.files = e.dataTransfer.files;
                fileNameSpan.textContent = e.dataTransfer.files[0].name;
            }
        });
        fileInput.addEventListener('change', () => {
            if (fileInput.files.length) fileNameSpan.textContent = fileInput.files[0].name;
        });

        async function search() {
            const file = fileInput.files[0];
            if (!file) { alert('请先选择一个音频文件'); return; }
            const mode = document.querySelector('input[name="mode"]:checked').value;
            const formData = new FormData();
            formData.append('file', file);
            formData.append('mode', mode);
            formData.append('top', '10');

            document.getElementById('loading').style.display = 'block';
            document.getElementById('results').innerHTML = '';
            document.getElementById('searchBtn').disabled = true;

            try {
                const resp = await fetch('/search', { method: 'POST', body: formData });
                const data = await resp.json();
                if (data.error) {
                    document.getElementById('results').innerHTML = `<p style="color:red">错误: ${data.error}</p>`;
                } else {
                    let html = `<h3>${data.mode === 'style' ? '🎧 风格相似推荐' : '🎼 旋律匹配结果'}</h3>`;
                    data.results.forEach(r => {
                        html += `
                        <div class="result-item">
                            <span class="name">${r.name}</span>
                            <span class="score">${data.mode === 'style' ? '相似度: '+r.score.toFixed(3) : 'DTW距离: '+r.score.toFixed(1)}</span>
                            <audio controls src="${r.audio_url}"></audio>
                        </div>`;
                    });
                    document.getElementById('results').innerHTML = html;
                }
            } catch (e) {
                document.getElementById('results').innerHTML = `<p style="color:red">请求失败: ${e.message}</p>`;
            } finally {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('searchBtn').disabled = false;
            }
        }
    </script>
</body>
</html>
